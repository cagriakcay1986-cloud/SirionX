name: Gunluk Bulten Cekici
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Paketleri Kur
        run: |
          pip install pandas requests beautifulsoup4 playwright
          playwright install chromium
      - name: Bülteni Çek
        run: python SirionX.py
      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name "SirionX-Bot"
          git config --global user.email "bot@sirionx.com"
          git add maclar.csv
          git commit -m "Bulten guncellendi" || echo "Degisiklik yok"
          git push
