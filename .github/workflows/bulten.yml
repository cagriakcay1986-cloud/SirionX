name: Gunluk Bulten Cekici
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git'e yazma yetkisi veriyoruz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Paketleri Kur
        run: pip install -r requirements.txt
      - name: Bülteni Çek
        run: python SirionX.py
      - name: Kaydet ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --autostash
          git add maclar.csv || echo "Dosya yok"
          git commit -m "Bulten guncellendi" || echo "Degisiklik yok"
          git push origin main
