name: Otonom Bülten Çekici
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # UTC 07:00, Türkiye saati ile 10:00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Paketleri Kur
        run: pip install pandas requests beautifulsoup4
      - name: Bülteni Çek
        run: python SirionX.py
      - name: Veriyi Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maclar.csv
          git commit -m "Gunluk bulten guncellendi"
          git push
